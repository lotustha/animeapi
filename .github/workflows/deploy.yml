name: Deploy API to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            cd /www/wwwroot/api.mugenstream.fun
            # Hand-edits on the VPS abort `git pull` and silently block every
            # deploy. Park them in the stash (recoverable via `git stash list`)
            # so the pull always goes through.
            git stash
            git pull origin main
            # pm2 runs `bun run src/index.ts` with watch disabled — the new
            # code isn't served until the process restarts.
            pm2 restart mugen-api
